name: CI

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  install-sdks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci --legacy-peer-deps

      - name: Install RenVault packages
        run: |
          npm install --no-audit --no-fund \
            renvault-admin@^1.0.2 \
            renvault-analytics@^1.0.2 \
            renvault-backup@^1.0.2 \
            renvault-bridge@^1.0.2 \
            renvault-chainhooks-realtime@^1.0.2 \
            renvault-emergency@^1.0.2 \
            renvault-gateway@^1.0.2 \
            renvault-governance@^1.0.2 \
            renvault-leaderboard@^1.0.2 \
            renvault-liquidity@^1.0.2 \
            renvault-mobile@^1.0.2 \
            renvault-monitoring@^1.0.2 \
            renvault-multi-asset@^1.0.2 \
            renvault-nft-rewards@^1.0.2 \
            renvault-notifications@^1.0.2 \
            renvault-oracle@^1.0.2 \
            renvault-referral@^1.0.2 \
            renvault-security-audit@^1.0.2 \
            renvault-staking@^1.0.2 \
            renvault-timelock@^1.0.1 \
            renvault-yield@^1.0.1

      - name: Verify RenVault packages
        run: npm list renvault-admin renvault-analytics renvault-backup
