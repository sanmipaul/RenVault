<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RenVault Leaderboard Update</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; }
        .header { background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .rank { font-size: 48px; font-weight: bold; color: #ed8936; text-align: center; margin: 20px 0; }
        .rank-label { text-align: center; color: #718096; font-size: 14px; margin-top: -15px; margin-bottom: 20px; }
        .score-box { background: #fffaf0; border: 1px solid #fbd38d; border-radius: 6px; padding: 15px; text-align: center; }
        .score-value { font-size: 24px; font-weight: bold; color: #c05621; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#x1F3C6; RenVault Leaderboard</h1>
            <h2>Your Position Has Updated!</h2>
        </div>
        <div class="content">
            <p>Great news! Your leaderboard ranking has been updated.</p>
            <div class="rank">#{{rank}}</div>
            <div class="rank-label">Current Leaderboard Position</div>
            <div class="score-box">
                <div class="score-value">{{score}} pts</div>
                <p style="color: #718096; margin: 5px 0 0;">Your Score</p>
            </div>
            <p style="margin-top: 20px;">Keep saving to climb higher on the leaderboard!</p>
        </div>
        <div class="footer">
            <p>RenVault - Rewarding Savers</p>
        </div>
    </div>
</body>
</html>
